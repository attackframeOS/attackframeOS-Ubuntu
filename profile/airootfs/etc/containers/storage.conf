# AttackFrame OS — rootful Podman storage.
# The Kali and BlackArch layer images ship pre-built in a read-only image store
# inside the OS image; containers' writable layers go to the normal graphroot
# (a tmpfs on the live ISO, see attackframe-firstboot).
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/usr/share/attackframe/containers/storage"]
